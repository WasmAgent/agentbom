name: Release
on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
  # N2-P1-09: expose a PR-safe release preflight. The `preconditions` job runs
  # the full release check set on PRs; publishing stays push-only.
  pull_request:
    branches: [main]
    paths:
      - ".changeset/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# AB-1: least-privilege default; write scopes are granted per-job below.
permissions:
  contents: read

jobs:
  # AB-2: full CI gate before any publish path runs. The changesets version
  # PR / publish below executes only when these preconditions are green.
  preconditions:
    name: "Release preconditions"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Canonical schema compatibility (AB-3/AB-4)
        run: bun test packages/agentbom-core/src/canonical-contract.test.ts
      - name: Record resolved dependency set (AB-4)
        run: |
          set -euo pipefail
          {
            echo "### Resolved dependency set (AB-4)"
            echo ""
            echo '```'
            echo "bun.lock sha256: $(sha256sum bun.lock | cut -d' ' -f1)"
            bun pm ls | grep -E "@wasmagent/(aep|protocol|mcp-posture)@" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  release:
    needs: preconditions
    # Publishing is push-only. On pull requests only `preconditions` (the
    # PR-safe release preflight) runs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # AB-2: publish from the exact source commit that passed preconditions.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # AB-2 / O4: record the exact package tarball digests eligible for
      # publication so published artifacts are independently auditable.
      - name: Record package tarball digests (AB-2/O4)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          : > package-digests.jsonl
          for pkg in packages/agentbom-core packages/agentbom-cli packages/agentbom-autogen packages/agentbom-langchain packages/agentbom-llamaindex; do
            if [ "$(node -p "require('./$pkg/package.json').private === true")" = "true" ]; then
              continue
            fi
            (cd "$pkg" && npm pack --json --pack-destination "$RUNNER_TEMP/pack") \
              | jq -c '.[0] | {name, version, integrity, shasum}' >> package-digests.jsonl
          done
          cat package-digests.jsonl
      - name: Upload package digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-digests-${{ github.sha }}
          path: package-digests.jsonl
          retention-days: 90
      # AB-5: npm provenance is emitted via OIDC (id-token: write). The scoped
      # NPM_TOKEN is retained only as the publish credential fallback; once npm
      # trusted publishing is configured for these packages, NODE_AUTH_TOKEN
      # can be dropped to rely on OIDC alone.
      - uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0
        with:
          version: bun run release:version
          publish: bun run release:publish
          commit: "chore: release"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
