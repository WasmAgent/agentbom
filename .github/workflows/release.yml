name: Release
on:
  push:
    branches: [main]
    paths: [".changeset/**", "packages/**"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # AB-2: full CI gate before any publish path runs. The changesets version
  # PR / publish below executes only when these preconditions are green.
  preconditions:
    name: "AB-2: release preconditions"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Canonical schema compatibility (AB-3/AB-4)
        run: bun test packages/agentbom-core/src/canonical-contract.test.ts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  release:
    needs: preconditions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0
        with:
          version: bun run release:version
          publish: bun run release:publish
          commit: "chore: release"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
